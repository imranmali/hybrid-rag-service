# Local stack. Invoke through the Makefile, or directly as:
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --wait
# Relative paths below resolve against this file's directory (infra/).
# Image tags are the pins from design.md contract C2; bump a patch version here (with a comment)
# only if a tag becomes unavailable.
name: hybrid-rag

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  flyway:
    image: flyway/flyway:11
    command: ["migrate"]
    restart: "no"
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_PLACEHOLDERS_INDEXER_PASSWORD: ${RAG_INDEXER_PASSWORD}
      FLYWAY_PLACEHOLDERS_READER_PASSWORD: ${RAG_READER_PASSWORD}
      FLYWAY_PLACEHOLDERS_ROUTER_PASSWORD: ${RAG_ROUTER_PASSWORD}
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ./migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  reranker:
    # Opt-in CPU container (Linux/CI). On Apple Silicon run `make reranker` on the host (MPS);
    # Docker Desktop cannot reach the GPU and CPU latency is ~40 s per 20-passage request.
    profiles: ["reranker-container"]
    build:
      context: ../reranker
    environment:
      RERANKER_DEVICE: cpu
      RERANKER_MODEL: ${RERANKER_MODEL}
      RERANKER_MODEL_REVISION: ${RERANKER_MODEL_REVISION}
      RERANKER_MAX_LENGTH: ${RERANKER_MAX_LENGTH}
      RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE}
      RERANKER_MAX_PASSAGES: ${RERANKER_MAX_PASSAGES}
      RERANKER_TORCH_THREADS: ${RERANKER_TORCH_THREADS}
      RERANKER_MAX_CONCURRENCY: "1"
      PORT: "8080"
      HF_HOME: /models
    ports:
      - "${RERANKER_HOST_PORT:-8081}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hf-cache:/models
    healthcheck:
      # The reranker image must provide python3 (it is a FastAPI app).
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 600s # first start downloads the model (~2.2 GB)

  service:
    build:
      context: ../service
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      RAG_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      RAG_DB_READER_USER: rag_reader
      RAG_DB_READER_PASSWORD: ${RAG_READER_PASSWORD}
      RAG_DB_ROUTER_USER: rag_router
      RAG_DB_ROUTER_PASSWORD: ${RAG_ROUTER_PASSWORD}
      RAG_OLLAMA_URL: ${OLLAMA_CONTAINER_URL}
      RAG_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
      RAG_LLM_MODEL: ${OLLAMA_LLM_MODEL}
      RAG_LLM_PROVIDER: ${LLM_PROVIDER}
      RAG_LLM_SEED: ${LLM_SEED}
      RAG_OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      RAG_RERANKER_URL: ${RERANKER_CONTAINER_URL:-http://host.docker.internal:8081}
      RAG_RETRIEVAL_EXACT_VECTOR_SEARCH: ${RAG_RETRIEVAL_EXACT_VECTOR_SEARCH}
      OTEL_SERVICE_NAME: rag-query-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: always_on
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    ports:
      - "${SERVICE_HOST_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    healthcheck:
      # The service image must provide curl.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      tempo:
        condition: service_healthy
    # No container healthcheck: the image is distroless (no shell, curl or wget).
    # The health_check extension listens on :13133 for external probes.

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  hf-cache:
  tempo-data:
