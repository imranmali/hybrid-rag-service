[project]
name = "hybrid-rag-indexer"
version = "0.1.0"
description = "Offline arXiv corpus acquisition and indexing for Hybrid RAG Service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "lxml>=5.2",
  "numpy>=2.0",
  "pgvector>=0.3",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "tokenizers>=0.20",
  "typer>=0.12",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "respx>=0.21",
  "ruff>=0.6",
  "testcontainers[postgres]>=4.8",
]

[project.scripts]
indexer = "indexer.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indexer"]

[tool.ruff]
extend = "../ruff.toml"

[tool.pytest.ini_options]
markers = [
  "integration: tests requiring a Testcontainers PostgreSQL database",
  "network: tests requiring live network access",
]
