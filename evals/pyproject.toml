[project]
name = "evals"
version = "0.1.0"
description = "Eval harness for the hybrid RAG service: dataset pipeline, runner, CI gate"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
  "numpy>=1.26",
]

[project.scripts]
evals = "evals.cli:app"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals"]

[tool.ruff]
extend = "../ruff.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: needs the running stack (service, Ollama, database); deselect with -m 'not live'"]
addopts = "-m 'not live'"

[tool.ruff.lint.per-file-ignores]
# Fixtures and expected-value tables read better on one line.
"tests/**" = ["E501"]
