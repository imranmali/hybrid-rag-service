server:
  port: 8080
spring:
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    hikari:
      connection-timeout: 1000
management:
  health:
    circuitbreakers:
      enabled: false
rag:
  version: 0.1.0
  git-sha: ${GIT_SHA:unknown}
  db:
    url: ${RAG_DB_URL:jdbc:postgresql://localhost:5433/rag}
    reader:
      user: ${RAG_DB_READER_USER:rag_reader}
      password: ${RAG_DB_READER_PASSWORD:rag_reader_dev}
      pool-size: ${RAG_DB_READER_POOL_SIZE:10}
    router:
      user: ${RAG_DB_ROUTER_USER:rag_router}
      password: ${RAG_DB_ROUTER_PASSWORD:rag_router_dev}
      pool-size: ${RAG_DB_ROUTER_POOL_SIZE:3}
  ollama:
    url: ${RAG_OLLAMA_URL:http://localhost:11434}
    keep-alive: ${RAG_OLLAMA_KEEP_ALIVE:30m}
  embed:
    model: ${RAG_EMBED_MODEL:bge-m3}
  llm:
    provider: ${RAG_LLM_PROVIDER:ollama}
    model: ${RAG_LLM_MODEL:llama3.1:8b}
    seed: ${RAG_LLM_SEED:42}
  reranker:
    url: ${RAG_RERANKER_URL:http://localhost:8081}
  retrieval:
    exact-vector-search: ${RAG_RETRIEVAL_EXACT_VECTOR_SEARCH:false}
  timeouts:
    connect-ms: 500
    route-ms: 5000
    embed-ms: 2000
    rerank-ms: 10000
    generate-ms: 45000
    sql-generate-ms: 15000
