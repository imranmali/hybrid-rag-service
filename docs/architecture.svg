<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Hybrid RAG Service architecture</title>
  <desc id="d">Offline path: arXiv API and HTML into the Python indexer, which embeds through host Ollama and writes to Postgres. Online path: a client calls the Kotlin service, whose stages are route, retrieve.vector and retrieve.bm25 in parallel, fuse, rerank and generate, with a SQL branch for aggregate questions. Dependencies: Postgres with pgvector, host Ollama and the reranker service. Traces flow from the service to the OTel collector, Tempo and Grafana.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <style>
      text { fill: #0f172a; font-size: 13px; }
      .h { font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: 0.06em; }
      .b { font-weight: 700; font-size: 14px; }
      .s { font-size: 11px; fill: #475569; }
      .w { font-size: 11px; fill: #b45309; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .stage { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .obs { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 1.5; }
      .dep { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.5; }
      .ln { fill: none; stroke: #334155; stroke-width: 1.5; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #b45309; stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#arrow-warn); }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="20" y="30" class="b" style="font-size:18px">Hybrid RAG Service: Python writes the index offline, Kotlin serves the query path and never writes</text>

  <!-- lane headings -->
  <text x="40" y="98" class="h">OFFLINE (PYTHON)</text>
  <text x="330" y="98" class="h">ONLINE (KOTLIN): QUERY PATH</text>
  <text x="890" y="98" class="h">DEPENDENCIES</text>

  <!-- ===== offline lane ===== -->
  <rect x="40" y="110" width="190" height="60" rx="6" class="box"/>
  <text x="135" y="134" text-anchor="middle" class="b">arXiv</text>
  <text x="135" y="154" text-anchor="middle" class="s">export API + arxiv.org/html</text>
  <path d="M135,170 L135,230" class="ln"/>

  <rect x="40" y="230" width="250" height="100" rx="6" class="box"/>
  <text x="165" y="254" text-anchor="middle" class="b">indexer</text>
  <text x="165" y="274" text-anchor="middle">parse · chunk 384/64 · header</text>
  <text x="165" y="292" text-anchor="middle">embed ×2 (content, header+content)</text>
  <text x="165" y="312" text-anchor="middle" class="s">idempotent on external_id + content hash</text>

  <!-- indexer -> Ollama (top corridor) -->
  <path d="M262,230 L262,72 L1030,72 L1030,110" class="ln"/>
  <text x="646" y="64" text-anchor="middle" class="s">embeddings (bge-m3) + context summaries (llama3.1:8b)</text>
  <!-- indexer -> Postgres (bottom corridor) -->
  <path d="M60,330 L60,682 L1186,682 L1186,300 L1172,300" class="ln"/>
  <text x="80" y="674" class="s">writes documents, chunks, embeddings, tsvectors as rag_indexer</text>

  <!-- legend -->
  <path d="M100,420 L150,420" class="ln"/>
  <text x="160" y="424" class="s">call</text>
  <path d="M100,445 L150,445" class="dash"/>
  <text x="160" y="449" class="s">degraded path</text>

  <!-- ===== online lane ===== -->
  <rect x="440" y="108" width="150" height="36" rx="6" class="box"/>
  <text x="515" y="131" text-anchor="middle">client: POST /v1/query</text>

  <rect x="330" y="158" width="450" height="370" rx="8" class="lane"/>
  <text x="342" y="176" class="s">Kotlin service · read-only</text>

  <path d="M515,144 L515,190" class="ln"/>
  <rect x="440" y="190" width="150" height="35" rx="6" class="stage"/>
  <text x="515" y="212" text-anchor="middle" class="b">route</text>

  <rect x="345" y="262" width="130" height="40" rx="6" class="stage"/>
  <text x="410" y="287" text-anchor="middle" class="b">retrieve.vector</text>
  <rect x="490" y="262" width="130" height="40" rx="6" class="stage"/>
  <text x="555" y="287" text-anchor="middle" class="b">retrieve.bm25</text>
  <rect x="650" y="262" width="120" height="40" rx="6" class="stage"/>
  <text x="710" y="287" text-anchor="middle" class="b">sql.execute</text>

  <path d="M490,225 L420,262" class="ln"/>
  <path d="M535,225 L550,262" class="ln"/>
  <path d="M590,214 L700,262" class="ln"/>
  <text x="656" y="224" class="s">aggregate</text>

  <rect x="420" y="335" width="200" height="35" rx="6" class="stage"/>
  <text x="500" y="357" text-anchor="middle" class="b">fuse</text>
  <text x="610" y="357" text-anchor="end" class="s">RRF k=60</text>
  <path d="M410,302 L470,335" class="ln"/>
  <path d="M555,302 L545,335" class="ln"/>

  <rect x="420" y="395" width="200" height="35" rx="6" class="stage"/>
  <text x="500" y="417" text-anchor="middle" class="b">rerank</text>
  <text x="610" y="417" text-anchor="end" class="s">top 20</text>
  <path d="M520,370 L520,395" class="ln"/>

  <rect x="420" y="455" width="200" height="35" rx="6" class="stage"/>
  <text x="520" y="477" text-anchor="middle" class="b">generate</text>
  <path d="M520,430 L520,455" class="ln"/>

  <!-- rerank unavailable: fused order goes straight to generate -->
  <path d="M620,352 L645,352 L645,472 L624,472" class="dash"/>
  <text x="652" y="408" class="w">rerank down:</text>
  <text x="652" y="422" class="w">fused order</text>
  <text x="520" y="509" text-anchor="middle" class="w">LLM down: passages returned, answer 503</text>

  <!-- service -> dependencies -->
  <path d="M780,150 L888,150" class="ln"/>
  <text x="834" y="143" text-anchor="middle" class="s">chat · embed</text>
  <path d="M780,300 L888,300" class="ln"/>
  <text x="834" y="293" text-anchor="middle" class="s">read-only SQL</text>
  <path d="M780,430 L888,430" class="ln"/>
  <text x="834" y="423" text-anchor="middle" class="s">rerank</text>

  <!-- ===== dependencies ===== -->
  <rect x="890" y="110" width="280" height="90" rx="6" class="dep"/>
  <text x="1030" y="134" text-anchor="middle" class="b">Ollama (host)</text>
  <text x="1030" y="154" text-anchor="middle">bge-m3 · llama3.1:8b</text>
  <text x="1030" y="174" text-anchor="middle" class="s">temperature 0, seed 42, model digests pinned</text>

  <rect x="890" y="250" width="280" height="100" rx="6" class="dep"/>
  <text x="1030" y="274" text-anchor="middle" class="b">Postgres (pgvector)</text>
  <text x="1030" y="294" text-anchor="middle">HNSW vectors · tsvector GIN</text>
  <text x="1030" y="312" text-anchor="middle">documents · chunks · authors · categories</text>
  <text x="1030" y="334" text-anchor="middle" class="s">one datastore for vectors, full text, SQL</text>

  <rect x="890" y="395" width="280" height="75" rx="6" class="dep"/>
  <text x="1030" y="419" text-anchor="middle" class="b">reranker service</text>
  <text x="1030" y="439" text-anchor="middle">bge-reranker-v2-m3 · FastAPI</text>
  <text x="1030" y="457" text-anchor="middle" class="s">host process (MPS) or CPU container · concurrency 1</text>

  <!-- ===== observability ===== -->
  <path d="M405,528 L405,572" class="ln"/>
  <text x="415" y="552" class="s">OTLP spans, one per stage</text>
  <rect x="340" y="572" width="130" height="50" rx="6" class="obs"/>
  <text x="405" y="602" text-anchor="middle" class="b">OTel collector</text>
  <path d="M470,597 L520,597" class="ln"/>
  <rect x="520" y="572" width="130" height="50" rx="6" class="obs"/>
  <text x="585" y="602" text-anchor="middle" class="b">Tempo</text>
  <path d="M650,597 L700,597" class="ln"/>
  <rect x="700" y="572" width="130" height="50" rx="6" class="obs"/>
  <text x="765" y="602" text-anchor="middle" class="b">Grafana</text>
  <text x="340" y="646" class="s">trace waterfall: route, retrieve.vector, retrieve.bm25, fuse, rerank, generate</text>
</svg>
